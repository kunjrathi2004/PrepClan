<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PrepClan</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">PrepClan</a>
            <ul class="nav-links">
                <!-- Populated by navbar-update.js -->
            </ul>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
        </div>
    </section>

    <section class="content-section">
        <div class="container">
            <div class="contact-wrapper">
                <div class="contact-form">
                    <h2>Get In Touch</h2>
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                        <div class="form-group">
                            <label for="exam">Target Exam</label>
                            <select id="exam" name="exam">
                                <option value="CAT">CAT 2026</option>
                                <option value="XAT">XAT</option>
                                <option value="SNAP">SNAP</option>
                                <option value="NMAT">NMAT</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
                <div class="contact-info">
                    <h2>Reach Out</h2>
                    <div class="info-item">
                        <strong>Email:</strong>
                        <p>info@prepclan.com</p>
                    </div>
                    <div class="info-item">
                        <strong>Support Hours:</strong>
                        <p>Monday - Saturday: 9 AM - 8 PM</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 PrepClan. All rights reserved.</p>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/navbar-update.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
